<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peligrómetro - CÓRDOBA EXTREMA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos del widget del Peligrómetro */
    .seccion-peligrometro {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }
    .gauge-wrap {
        position: relative;
        width: 100%;
        max-width: 450px;
        margin: 20px auto;
    }
    .gauge-svg { width: 100%; height: auto; display: block; }
    
    #needle {
        transform-origin: 240px 245px;
        transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    /* Grilla de botones (Responsiva) */
    .sport-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 30px 0;
    }
    @media (min-width: 600px) {
        .sport-grid { grid-template-columns: repeat(6, 1fr); }
    }
    
    .sport-btn {
        background: #ffffff;
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 15px 5px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        transition: 0.3s;
    }
    .sport-btn:hover, .sport-btn.active {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .sport-btn i { font-size: 24px; }
    .sport-btn span {
        font-size: 11px;
        color: #3e2723;
        font-weight: bold;
        text-align: center;
    }
    
    /* Panel de información (Estilo Tarjeta Blanca Fija) */
    .info-panel {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        min-height: 120px;
        box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .info-empty {
        color: #8b5e3c;
        font-size: 14px;
        text-align: center;
        margin-top: 20px;
        font-weight: 500;
    }
    .info-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }
    .info-name {
        font-size: 18px;
        font-weight: bold;
        color: #3e2723;
        font-family: 'Oswald', sans-serif;
    }
    .info-badge {
        font-size: 11px;
        font-weight: bold;
        padding: 4px 12px;
        border-radius: 50px;
        color: #ffffff;
        text-transform: uppercase;
    }
    .info-desc {
        font-size: 14px;
        color: #2b2118;
        line-height: 1.6;
        text-align: left;
    }
  </style>
</head>
<body>

  <nav>
    <a href="./index.html">Home</a>
    <a href="Deportes.html">Deportes</a>
    <a href="Mapa de Córdoba.html">Mapa de Córdoba</a>
    <a href="Peligrometro.html">Peligrómetro</a>
    <a href="autora.html">Autora</a>
  </nav>

  <h1>Peligrómetro Extremo</h1>
  <h3>Medí el riesgo y elegí tu próximo desafío</h3>

  <section class="seccion-peligrometro" aria-label="Peligrómetro de deportes">
    
    <div class="gauge-wrap">
      <svg class="gauge-svg" viewBox="0 0 480 265" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#2ecc71"/> <stop offset="30%"  stop-color="#f1c40f"/> <stop offset="65%"  stop-color="#e67e22"/> <stop offset="100%" stop-color="#e74c3c"/> </linearGradient>
        </defs>

        <path d="M 30 245 A 210 210 0 0 1 450 245" fill="none" stroke="#ddd" stroke-width="32" stroke-linecap="round"/>
        <path d="M 30 245 A 210 210 0 0 1 450 245" fill="none" stroke="url(#arcGrad)" stroke-width="32" stroke-linecap="round" opacity="0.9"/>

        <text x="25" y="236" font-size="10" fill="#2ecc71" text-anchor="middle" font-family="'Oswald', sans-serif" font-weight="600">BAJO</text>
        <text x="240" y="28" font-size="10" fill="#e67e22" text-anchor="middle" font-family="'Oswald', sans-serif" font-weight="600">ALTO</text>
        <text x="455" y="236" font-size="10" fill="#e74c3c" text-anchor="middle" font-family="'Oswald', sans-serif" font-weight="600">EXTREMO</text>

        <g id="needle" style="transform: rotate(-90deg);">
          <line x1="240" y1="245" x2="240" y2="68" stroke="#3e2723" stroke-width="4" stroke-linecap="round"/>
          <circle cx="240" cy="245" r="10" fill="#3e2723"/>
          <circle cx="240" cy="245" r="5"  fill="#e7dcc8"/> </g>
        <text id="gauge-label" x="240" y="225" font-size="14" fill="#3e2723" text-anchor="middle" font-family="'Oswald', sans-serif" font-weight="500"></text>
      </svg>
    </div>

    <div class="sport-grid" id="sportGrid"></div>

    <div class="info-panel" id="infoPanel">
      <p class="info-empty">Seleccioná un deporte para ver su nivel de peligro</p>
    </div>

  </section>

  <footer> 
    <p> Alma Olarte Arias - Diseño Multimedia I - Lic. Periodismo y Nuevos Medios - Universidad Blas Pascal / 2026 </p>
  </footer>

<script>
(function () {
  // Unificamos los íconos usando Font Awesome en lugar de Tabler Icons
  var sports = [
    { id: "mtb", name: "Mountain Bike", icon: "fa-bicycle", level: "Baja–Media", angle: -68, color: "#2ecc71", desc: "Uno de los deportes más accesibles para empezar. Podés iniciar en senderos llanos e ir aumentando la dificultad de los descensos a medida que ganás confianza." },
    { id: "escalada", name: "Escalada", icon: "fa-mountain", level: "Media", angle: -35, color: "#f1c40f", desc: "Se empieza en palestra con cuerda Top Rope, lo que permite ganar fuerza y técnica de forma muy segura antes de saltar a la roca real." },
    { id: "bicicross", name: "Bicicross", icon: "fa-bolt", level: "Media–Alta", angle: -8, color: "#e67e22", desc: "Dominar la inercia de los saltos, el ritmo de la pista y el control en el aire requiere mucha técnica y caídas de práctica." },
    { id: "enduro", name: "Enduro", icon: "fa-motorcycle", level: "Alta", angle: 22, color: "#d35400", desc: "Exige excelente condición física, lectura rápida del terreno natural (piedras, raíces, barro) y saber dosificar la energía durante horas." },
    { id: "velocidad", name: "Moto Velocidad", icon: "fa-gauge-high", level: "Alta", angle: 48, color: "#d35400", desc: "La velocidad reduce los tiempos de reacción drásticamente. Aprender a trazar curvas y gestionar frenadas a altas velocidades exige circuitos controlados y mucha instrucción." },
    { id: "motocross", name: "Motocross", icon: "fa-triangle-exclamation", level: "Muy Alta", angle: 80, color: "#e74c3c", desc: "El control en superficies resbaladizas y la gestión de saltos grandes requieren técnica muy específica. El esfuerzo físico es de los más exigentes del mundo deportivo." }
  ];

  var needle = document.getElementById("needle");
  var infoPanel = document.getElementById("infoPanel");
  var gaugeLabel = document.getElementById("gauge-label");
  var grid = document.getElementById("sportGrid");
  var active = null;

  // Generación dinámica de los botones con Font Awesome
  sports.forEach(function (s) {
    var btn = document.createElement("button");
    btn.className = "sport-btn";
    btn.id = "btn-" + s.id;
    btn.innerHTML = '<i class="fa-solid ' + s.icon + '" style="color:' + s.color + '"></i><span>' + s.name + '</span>';
    btn.addEventListener("click", function () { toggle(s); });
    grid.appendChild(btn);
  });

  function toggle(s) {
    if (active === s.id) {
      active = null;
      needle.style.transform = "rotate(-90deg)";
      gaugeLabel.textContent = "";
      infoPanel.innerHTML = '<p class="info-empty">Seleccioná un deporte para ver su nivel de peligro</p>';
      document.querySelectorAll(".sport-btn").forEach(function (b) {
        b.classList.remove("active");
        b.style.borderColor = "transparent";
      });
      return;
    }

    active = s.id;
    needle.style.transform = "rotate(" + s.angle + "deg)";
    gaugeLabel.textContent = s.level;

    document.querySelectorAll(".sport-btn").forEach(function (b) {
      b.classList.remove("active");
      b.style.borderColor = "transparent";
    });
    
    var ab = document.getElementById("btn-" + s.id);
    ab.classList.add("active");
    ab.style.borderColor = s.color;

    infoPanel.innerHTML =
      '<div class="info-header">' +
        '<i class="fa-solid ' + s.icon + '" style="color:' + s.color + '; font-size:20px;"></i>' +
        '<span class="info-name">' + s.name + '</span>' +
        '<span class="info-badge" style="background:' + s.color + ';">' + s.level + '</span>' +
      '</div>' +
      '<p class="info-desc">' + s.desc + '</p>';
  }
})();
</script>
</body>
</html>
